version: "3.8"
services:
  loki:
    image: "grafana/loki:v2.8.0" # Loki Docker image (you can check for the latest version) [cite: 3]
    ports:
      - "3100:3100" # Map port 3100 on the host to 3100 in the container
    volumes:
      - loki_data:/data # Mount a volume for Loki data
      - ./loki-config.yaml:/etc/loki/local-config.yaml # Mount Loki's config file
    command: -config.file=/etc/loki/local-config.yaml # Tell Loki where its config is

  promtail:
    image: "grafana/promtail:v2.8.0" # Promtail Docker image (match Loki's version)
    volumes:
      - /var/log:/var/log # Mount the host's log directory (IMPORTANT: Adjust this!)
      - ./promtail-config.yaml:/etc/promtail/config.yml # Mount Promtail's config file
    command: -config.file=/etc/promtail/config.yml # Tell Promtail where its config is
    depends_on:
      - loki # Promtail needs Loki to be running

  grafana:
    image: "grafana/grafana:10.1.5" # Grafana Docker image (you can check for the latest version)
    ports:
      - "3000:3000" # Map port 3000 on the host to 3000 in the container
    volumes:
      - grafana_data:/var/lib/grafana # Mount a volume for Grafana data
    depends_on:
      - loki # Grafana needs Loki to be running
volumes:
  loki_data:  # Define volumes
  grafana_data:
