auth_enabled: false # Disable authentication (for simplicity in this guide)

server:
  http_listen_port: 3100 # Loki listens on port 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  wal:
    enabled: true

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb
      object_lifetime: 24h

storage_config:
  boltdb:
    directory: /data/loki/index

  filesystem:
    directory: /data/loki/chunks
